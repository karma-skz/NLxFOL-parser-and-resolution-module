- name: "no-noun-aux-both-adj-and-adj"
  pattern: ["no", "NOUN", "AUX", "both", "ADJ", "and", "ADJ"]
  template: "forall x. (/NOUN(x) -> not (/ADJ_1(x) & /ADJ_2(x)))"

- name: "it-is-not-case-that-all-noun-verb"
  pattern: ["it", "is", "not", "the", "case", "that", "all", "NOUN", "VERB"]
