# ==========================================

- name: "every-noun-who-aux-adj-aux-adj"
  pattern: ["every", "NOUN", "who", "AUX", "ADJ", "AUX", "ADJ"]
  template: "forall x. ((/NOUN(x) & /ADJ_1(x)) -> /ADJ_2(x))"

- name: "a-noun-who-verb-verb"
  pattern: ["a", "NOUN", "who", "VERB", "VERB"]
  template: "exists x. (/NOUN(x) & /VERB_1(x) & /VERB_2(x))"

- name: "all-noun-who-aux-adj-aux-noun"
  pattern: ["all", "NOUN", "who", "AUX", "ADJ", "AUX", "NOUN"]
  template: "forall x. ((/NOUN_1(x) & /ADJ(x)) -> /NOUN_2(x))"

